networks:
  taskboard-network:
    driver: bridge
    external: true
    name: taskboard-network

services:
  client:
    container_name: client
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "npm run dev"]
    image: ghcr.io/maksosteam/frontend:1.0.4
    ports:
      - 5173:5173
    networks:
      - taskboard-network
    env_file:
      - .env
